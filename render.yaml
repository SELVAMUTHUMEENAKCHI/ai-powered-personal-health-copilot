services:
  - type: web
    name: ai-health-copilot-backend
    env: node
    plan: free
    buildCommand: npm ci && npm run build:shared && npm run build:server
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://selvamuthumeenakchi.github.io
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
